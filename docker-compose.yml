services:
  mc:
    image: itzg/minecraft-server:latest
    tty: true
    stdin_open: true
    ports:
      - "25565:25565"
      - "24454:24454/udp"
      - "24454:24454/tcp"
    depends_on:
      restore-backup:
        condition: service_completed_successfully
    environment:
      EULA: "TRUE"
      TYPE: "FORGE"
      VERSION: "1.20.1"
      MEMORY: "10240M"
      MOTD: "Rebmember this is a modded server that at some point will break. Brought to you by Vought"
      ICON: "https://i.pinimg.com/736x/e0/16/0e/e0160e6c4e0544c87c418757926ec3ea.jpg"
      USE_AIKAR_FLAGS: "true"
      MODRINTH_PROJECTS: |-
        chunky:4FTDk9wv
        compound-v:C65KHe5Y
        compound-v-gone-viral:FipGJLSZ
        pehkui:SQpqSgAE
        simple-voice-chat:3FOFOFRt
        better-village:zvb4Gj0d
        caged-mobs:xu8CgGzR
        aether-lost-content:PVl7uKx1
        structure-gel-api:xavY0MZc
        framedblocks:lSiHA1qU
        lightmans-currency:eAALa47O
        quark:DijQLauD
        zeta:mSER3jBI
        farmers-delight:CsjS7EkP
        sophisticated-core:Kum0Dlrd
        sophisticated-backpacks:XGacFFnr
        compound-v:C65KHe5Y
        compound-v-gone-viral:FipGJLSZ
        simple-voice-chat:3FOFOFRt
        better-village:zvb4Gj0d
        caged-mobs:xu8CgGzR
        aether-lost-content:PVl7uKx1
        structure-gel-api:xavY0MZc
        framedblocks:lSiHA1qU
        lightmans-currency:eAALa47O
        quark:DijQLauD
        zeta:mSER3jBI
        farmers-delight:CsjS7EkP
        sophisticated-core:Kum0Dlrd
        sophisticated-backpacks:XGacFFnr
      CURSEFORGE_FILES: |-
        ftb-ultimine-forge:7880472
        architectury-api:5137938
        ftb-library-forge:8226927
        ftb-ranks-forge:6522073
        library-ferret-forge:4601234
        aether:6134920
        immersive-paintings:8140573
        easy-villagers:5724570
        global-xp:5644158
        aether-villages:5707985
        gravestone-mod:7099725
        spartan-weaponry:6842571
        lets-do-vinery:6965751
        from-the-fog:4603882
        disccord:7818174
        jei:8526990
        small-ships:5566900
      CF_API_KEY: "$$2a$$10$$SNbeVMqCxi3PvC5R0p2o1OFKe7ysIMeLmIWQ3WeBx54rhW6IyjJ36"
    volumes:
      - "./data:/data"
    restart: unless-stopped # Add the restart policy here 
  restore-backup:
    image: itzg/mc-backup
    user: "1000"
    restart: "no"
    entrypoint: restore-tar-backup
    volumes:
      - "./data:/data"
      - "./mc-backups:/backups:ro"

  backups:
    image: itzg/mc-backup
    user: "1000"
    depends_on:
      mc:
        condition: service_healthy
    environment:
      BACKUP_INTERVAL: "2h"
      RCON_HOST: mc
      INITIAL_DELAY: "0"
      PRUNE_BACKUPS_DAYS: "1"
    volumes:
      - "./data:/data:ro"
      - "./mc-backups:/backups"

  onedrive-sync:
    image: rclone/rclone:latest
    restart: unless-stopped
    environment:
      RCLONE_CONFIG: /config/rclone/rclone.conf
    volumes:
      - "./mc-backups:/backups:ro"
      - "./rclone:/config/rclone"   # mount the whole dir, read-write
    entrypoint: >
      sh -c "
      while true; do
        echo \"[$(date)] Syncing backups to OneDrive...\";
        rclone sync /backups onedrive:mc-backups --create-empty-src-dirs -v;
        sleep 3600;
      done
      "
  
